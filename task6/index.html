<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор стоимости услуги</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Калькулятор стоимости услуги</h2>

  <label for="quantity">Количество:</label>
  <input type="number" id="quantity" min="1" value="1">

  <h3>Тип услуги:</h3>
  <label><input type="radio" name="type" value="1" checked> Тип 1</label>
  <label><input type="radio" name="type" value="2"> Тип 2</label>
  <label><input type="radio" name="type" value="3"> Тип 3</label>

  <div id="optionsBlock" style="display:none;">
    <label for="optionsSelect">Опции:</label>
    <select id="optionsSelect"></select>
  </div>

  <div id="propertyBlock" style="display:none;">
    <label><input type="checkbox" id="propertyCheck"> Дополнительное свойство</label>
  </div>

  <div id="result">Стоимость: 0 руб.</div>

  <script src="script.js"></script>
</body>
</html>
