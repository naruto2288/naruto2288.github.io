<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8">
    <title>Калькулятор стоимости заказа</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h2>Калькулятор стоимости заказа</h2>


        <label for="quantity">Количество товара:</label>
        <input type="number" id="quantity" min="1" value="1">


        <label for="product">Товар:</label>
        <select id="product">
            <option value="150">Сливочное масло — 150 руб.</option>
            <option value="40">Хлеб — 40 руб.</option>
            <option value="200">Сыр — 200 руб.</option>
        </select>


        <label>Стоимость товара (за единицу):</label>
        <input type="text" id="priceField" readonly>


        <button id="calcBtn">Рассчитать стоимость заказа</button>


        <div id="result"></div>


        <script src="script.js"></script>
    </body>
</html>
