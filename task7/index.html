<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Галерея</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    padding: 20px;
    background: #f6f6f6;
  }

  .slider-wrapper {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: auto;
  }

  .slider {
    display: flex;
    overflow: hidden;
    width: 100%;
    gap: 20px;
  }

  .slider img {
    width: calc((100% - 40px) / 3);
    object-fit: cover;
    border-radius: 6px;
    animation: fade 0.3s ease;
  }

  @media (max-width: 600px) {
    .slider img {
      width: 100%;
    }
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px;
    background: #fff;
    cursor: pointer;
    z-index: 10;
    user-select: none;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }

  .arrow.left { left: -60px; }
  .arrow.right { right: -60px; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
  }

  .dot {
    width: 12px;
    height: 12px;
    background: #bbb;
    border-radius: 50%;
    cursor: pointer;
  }

  .dot.active {
    background: #555;
    transform: scale(1.15);
  }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (max-width: 600px) {
  .arrow.left {
    left: 10px;
  }

  .arrow.right {
    right: 10px;
  }
}

@media (max-width: 600px) {
  .arrow {
    padding: 6px;
    font-size: 14px;
  }
}

</style>
</head>

<body>

<div class="slider-wrapper">
  <div class="arrow left" id="prev">◀</div>
  <div class="slider" id="slider"></div>
  <div class="arrow right" id="next">▶</div>
</div>

<div class="dots" id="dots"></div>

<script>
const images = [
  "image1.jpg",
  "image2.jpg",
  "image3.jpg",
  "image4.jpg",
  "image5.jpg",
  "image6.jpg",
  "image7.jpg",
  "image8.jpg"
];

let index = 0;
const slider = document.getElementById("slider");
const dots = document.getElementById("dots");

function slidesPerView() {
  return window.innerWidth <= 600 ? 1 : 3;
}

function render() {
  const count = slidesPerView();
  const total = images.length;
  slider.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const img = document.createElement("img");
    img.src = images[(index + i) % total];
    slider.appendChild(img);
  }

  updateDots();
}

function updateDots() {
  dots.innerHTML = "";
  images.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i === index ? " active" : "");
    d.onclick = () => {
      index = i;
      render();
    };
    dots.appendChild(d);
  });
}

document.getElementById("prev").onclick = () => {
  index = (index - 1 + images.length) % images.length;
  render();
};

document.getElementById("next").onclick = () => {
  index = (index + 1) % images.length;
  render();
};

window.onresize = render;
render();
</script>

</body>
</html>
